name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: exp4j
            jdk: "8"
          - module: java-sandbox
            jdk: "8"
          - module: installer-agent
            jdk: "8"
          - module: optifine-renamer
            jdk: "8"
          - module: cacio-shared-8
            jdk: "8"
          - module: cacio-androidnw-8
            jdk: "8"
          - module: cacio-shared-17
            jdk: "17"
          - module: cacio-tta-17
            jdk: "17"
          - module: cacio-agent-17
            jdk: "17"
          - module: mio-lib-patcher
            jdk: "8"
    name: ":${{ matrix.module }} (JDK ${{ matrix.jdk }})"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17 runs Gradle itself; the per-module toolchains (8 or 17) are
      # resolved from the JDKs installed here plus foojay auto-provisioning.
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # DRAFT: builds the main jar only (tests are vendored but not wired).
      - name: Build jar
        run: gradle ":${{ matrix.module }}:jar" --no-daemon --stacktrace

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error

      # Publish jars as release assets only when a tag push triggers the run.
      - name: Publish jar to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.module }}/build/libs/*.jar
